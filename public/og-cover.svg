<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#022C22"/>
      <stop offset="50%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#06281E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <pattern id="islamicGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 0L40 20L20 40L0 20Z" fill="none" stroke="#34D399" stroke-width="0.75" stroke-opacity="0.12"/>
      <circle cx="20" cy="20" r="2.5" fill="#F59E0B" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#islamicGrid)"/>

  <!-- Glowing Aura -->
  <circle cx="600" cy="315" r="380" fill="#059669" fill-opacity="0.15" filter="blur(60px)"/>
  <circle cx="600" cy="240" r="200" fill="#D97706" fill-opacity="0.1" filter="blur(40px)"/>

  <!-- Border Card Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="#042F24" fill-opacity="0.45" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.3"/>
  <rect x="52" y="52" width="1096" height="526" rx="16" fill="none" stroke="#F59E0B" stroke-width="0.75" stroke-opacity="0.25"/>

  <!-- Top Emblem / Motif -->
  <g transform="translate(600, 110)">
    <line x1="-120" y1="0" x2="-20" y2="0" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="0" y="6" font-family="serif" font-size="22" fill="#F59E0B" text-anchor="middle">۞</text>
    <line x1="20" y1="0" x2="120" y2="0" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6"/>
  </g>

  <!-- Brand Pill -->
  <g transform="translate(600, 160)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#065F46" fill-opacity="0.7" stroke="#34D399" stroke-width="1" stroke-opacity="0.4"/>
    <text x="0" y="6" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#A7F3D0" text-anchor="middle" letter-spacing="2.5">
      KIRIMAYAT.XYZ
    </text>
  </g>

  <!-- Arabic Bismillah Calligraphy -->
  <text x="600" y="245" font-family="'Amiri', 'Traditional Arabic', serif" font-size="34" fill="#FDE68A" text-anchor="middle" letter-spacing="1">
    بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
  </text>

  <!-- Main Headline -->
  <text x="600" y="325" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="middle">
    Kirim Pesan &amp; Ayat Al-Qur&apos;an
  </text>

  <!-- Tagline / Subtitle -->
  <text x="600" y="380" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="400" fill="#D1FAE5" text-anchor="middle" opacity="0.9">
    Sampaikan doa tulus dan curahan hatimu bersama lantunan ayat suci penyejuk jiwa.
  </text>

  <!-- Feature Badges Row -->
  <g transform="translate(600, 460)">
    <!-- Badge 1 -->
    <g transform="translate(-320, 0)">
      <rect x="0" y="0" width="200" height="42" rx="21" fill="#047857" fill-opacity="0.5" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
      <text x="100" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ECFDF5" text-anchor="middle">
        📖 114 Surah Al-Qur&apos;an
      </text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(-100, 0)">
      <rect x="0" y="0" width="200" height="42" rx="21" fill="#047857" fill-opacity="0.5" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
      <text x="100" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ECFDF5" text-anchor="middle">
        🎙️ Audio Tilawah Jernih
      </text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(120, 0)">
      <rect x="0" y="0" width="200" height="42" rx="21" fill="#047857" fill-opacity="0.5" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
      <text x="100" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ECFDF5" text-anchor="middle">
        📱 Ekspor Story 9:16
      </text>
    </g>
  </g>

  <!-- Footer Link -->
  <text x="600" y="545" font-family="monospace" font-size="14" fill="#6EE7B7" text-anchor="middle" opacity="0.8">
    sendtheayat.pages.dev • Terinspirasi dari SendTheSong.xyz
  </text>
</svg>
